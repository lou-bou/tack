name: tack

services:
  app:
    build: .
    image: tack-app
    container_name: tack-app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${PORT:-8097}
      DB_PATH: /data/tack.db
    ports:
      # Never expose publicly: Cloudflare Zero Trust is the only way in.
      - '${BIND_ADDR:-127.0.0.1}:${PORT:-8097}:${PORT:-8097}'
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+process.env.PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
