name: kit
description: Shared core for Lou's self-hosted apps (API access, Cloudflare Access auth, storage, offline queue, theme, widgets).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.3.2
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
