name: tack
description: Tack for Android and iOS. Personal build, sideloaded, never published.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flutter_riverpod: ^3.5.0
  kit:
    path: ../packages/kit
  lucide_icons_flutter: ^4.0.3
  dio: ^5.11.1
  path_provider: ^2.1.6
  sqflite: ^2.4.6
  url_launcher: ^6.3.2
  flutter_local_notifications: ^23.0.2
  package_info_plus: ^10.2.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
